<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
  <title>With Emily</title>

  <style>
    :root {
      --bg: #020244;
      --text: #f5f5f5;
      --accent: #9b846f;
      --muted: #918c8b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    h1, h2 {
      margin-bottom: 1rem;
      letter-spacing: 1px;
    }

    p {
      margin-bottom: 1rem;
      color: var(--muted);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .hero {
        padding: 10rem 5rem;
        text-align: center;
        background-image: linear-gradient(
            rgba(15, 15, 16, 0.0),
            rgba(15, 15, 16, 0.0)
            ),
            url('media/Banner.png');

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    @font-face {
      font-family: 'impact-label';
      src: url('fonts/ImpactLabel-lVYZ.woff2') format('woff2');
    }

    .subhero {
        text-align: center;
    }
    .subhero h1 {
      font-size: 3.5rem;
      text-align: center;
    }
    

    .subhero p {
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .button {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 1px;
      transition: 0.2s ease;
    }

    .button:hover {
      background: var(--accent);
      color: var(--bg);
    }

    section {
      margin-bottom: 3rem;
    }

    iframe {
      width: 100%;
      border: none;
      border-radius: 8px;
      margin-top: 1rem;
    }

    .shows div {
      margin-bottom: 0.5rem;
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
      padding: 2rem 0;
    }


    @media (max-width: 600px) {
      .hero h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>

  <div class="hero">
    <!-- <h1>With Emily</h1>
    <p>Nothing More out now everywhere!</p>
    <a href="https://share.amuse.io/track/with-emily-nothing-more" class="button">Listen Now</a> -->
  </div>

  <div class="container">
    <section class="subhero">
        <h1>With Emily</h1>
        <p>Nothing More out now everywhere!</p>
        <a href="https://share.amuse.io/track/with-emily-nothing-more" class="button">Listen Now</a>
    </section>
    <section>
      <h2>Music</h2>
      <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/artist/4IbtZKtYkwXdnrERFiv0MM?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </section>

    <section>
      <h2>About</h2>
      <p>
       With Emily is the musical creations of Emily Bennor and Kyle Petersen.
      </p>
    </section>

    <!-- <section class="shows">
      <h2>Shows</h2>
      <div>May 18 – 7th St Entry – Minneapolis</div>
      <div>June 2 – First Avenue – Minneapolis</div>
    </section> -->

    <section>
      <h2>Contact</h2>
      <p>Producer/Manager - Kyle Petersen
      </p>
      <p>Email: <a href="mailto:kyleandrewpetersen@gmail.com">kyleandrewpetersen@gmail.com</a></p>
      <p>
        <a href="https://www.instagram.com/ebennor/">Instagram</a>
      </p>
    </section>

  </div>

  <footer>
    <p>© 2026 With Emily</p>
  </footer>

</body>
</html>
